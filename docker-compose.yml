version: '3.8'
services:
  automation-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - API_KEY=default_secret_key
    volumes:
      - ./automation-system/storage:/app/automation-system/storage

  cloud-desktop:
    build:
      context: ./cloud-desktop
      dockerfile: Dockerfile
    ports:
      - "6080:6080"
    depends_on:
      - automation-api
    environment:
      - DISPLAY=:1
