<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>jor1k: OpenRISC OR1K Javascript Emulator Running Linux With Network Support</title>
        <meta name="keywords" content="opencore, emulation, or1000, javascript, linux">
        <meta name="author" content="Sebastian Macke">
        <link rel="stylesheet" href="css/default.css">
        <link rel="stylesheet" href="css/modern.css">
    </head>
    <body onload="Start()">

    <div id="classic-header">
        <canvas id="fbfullscreen" width="640" height="400" style="width: 0px; height: 0px;"></canvas>
        <div class="heading" id="heading">
            <h1>jor1k: OpenRISC OR1K Javascript Emulator Running Linux With Network Support</h1>
        </div>
    </div>

    <div class="modern-container" id="main-container">
        <div class="modern-emulator-row">
            <div class="modern-terminal-wrapper">
                <table id="tty" class="terminal" cellpadding="0" cellspacing="0"></table>
            </div>
            <div class="modern-screen-wrapper">
                <canvas id="fb" class="screen" width="640" height="400"></canvas>
            </div>
        </div>

        <div class="modern-controls">
            <select id="fpsselect" onchange='jor1k.framebuffer.SetFPS(this.options[this.selectedIndex].value)'>
                <option value="0">0 FPS</option>
                <option value="5"> 5 FPS</option>
                <option value="10" selected>10 FPS </option>
                <option value="20">20 FPS</option>
                <option value="30">30 FPS</option>
            </select>

            <input type="text" id="loadPath" value="/home/user" />

            <div class="d-flex gap-2">
                <label style="margin:0">
                    <img src="images/upload.png" width="18px" height="18px" title="Upload" class="modern-icon-btn" />
                    <input type="file" id="files" style="display:none" onchange='OnUploadFiles(this.files)' multiple />
                </label>
                <img src="images/tar.png" width="18px" height="18px" onclick='jor1k.fs.TAR(document.getElementById("loadPath").value)' title="Download" class="modern-icon-btn" />
                <img src="images/sync.png" width="18px" height="18px" onclick='jor1k.fs.Sync("home/user")' title="Sync" class="modern-icon-btn" />
                <img src="images/fullscreen.png" width="18px" height="18px" onclick='Fullscreen()' title="Fullscreen" class="modern-icon-btn" />
            </div>

            <textarea style="height: 20px;" type=text cols="5" rows="1" id="clipboard">clipb</textarea>

            <label class="small"><input type="checkbox" onclick='jor1k.sound.Enabled(this.checked)'> Audio</label>
            <span id="stats" style="margin-left:auto"></span>
        </div>
    </div>

    <div class="infobox" id="infobox">
        <h3>Links</h3>
        <ul>
            <li><a href="compile.html">Edit, compile and run</a> C code in your browser</li>
            <li><a href="https://github.com/s-macke/jor1k/wiki/Explore-the-emulator">Explore the emulator</a></li>
            <li><a href="https://github.com/s-macke/jor1k/">Project</a> page at github</li>
        </ul>
    </div>

    <script src="jor1k-master-min.js"></script>
    <script>
        var Jor1k = require("Jor1k");
        var LinuxTerm = require("LinuxTerm");

        function Fullscreen() {
            document.body.style.margin = '0px';
            window.onresize = function(event) {
                var x = window.innerWidth, y = window.innerHeight;
                var d = x/y;
                if (d > 1.6) x = y*1.6; else y = x/1.6;
                var fb = document.getElementById("fbfullscreen");
                fb.style.width = x + "px"; fb.style.height = y + "px";
            };
            window.onresize();
            jor1k.framebuffer.Init("fbfullscreen");
        }

        function OnUploadFiles(files) {
            var path = document.getElementById("loadPath").value;
            for (var i = 0, f; f = files[i]; i++) jor1k.fs.UploadExternalFile(path, f);
        }

        function RandomString(length) {
            var chars = "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
            var result = '';
            for (var i = length; i > 0; --i) result += chars[Math.round(Math.random() * (chars.length - 1))];
            return result;
        }

        function getQueryVariable(variable) {
            var query = window.location.search.substring(1);
            var vars = query.split("&");
            for (var i=0;i<vars.length;i++) {
                var pair = vars[i].split("=");
                if(pair[0] == variable) return decodeURIComponent(pair[1]);
            }
            return false;
        }

        function Start() {
            var pushState = false, loadUserData = false;
            var userid = getQueryVariable("user");
            if (userid == false) { userid = RandomString(10); pushState = true; } else { loadUserData = true; }
            var relayURL = getQueryVariable("relayURL") || "wss://relay.widgetry.org/";

            jor1kparameters = {
                path: "../openrisc-sys/",
                system: { kernelURL: "kernel/vmlinux.bin.bz2", memorysize: 32, cpu: "asm", ncores: 1 },
                fs: { basefsURL: "basefs.json", extendedfsURL: "fs.json", earlyload: [], lazyloadimages: [] },
                term: new LinuxTerm("tty"), fbid: "fb", clipboardid: "clipboard", statsid: "stats", fps: 10,
                relayURL: relayURL, userid: userid, syncURL: "//jor1k.com/sync/upload.php"
            }

            if (loadUserData) jor1kparameters.fs.lazyloadimages.push("sync/tarballs/"+userid+".tar.bz2");
            var n = getQueryVariable("n"); if (n) jor1kparameters.system.ncores = n;
            var cpu = getQueryVariable("cpu"); if (cpu) jor1kparameters.system.cpu = cpu;

            if (pushState) {
                window.history.pushState([], "", "?user="+encodeURIComponent(jor1kparameters.userid)+"&cpu="+encodeURIComponent(jor1kparameters.system.cpu)+"&n="+encodeURIComponent(jor1kparameters.system.ncores)+"&relayURL="+encodeURIComponent(relayURL));
            }
            jor1k = new Jor1k(jor1kparameters);
        }

        // Embedded Mode Detection
        if (window.location.search.includes("embed=true")) {
            document.body.classList.add("modern-mode");
            document.getElementById("classic-header").style.display = "none";
            document.getElementById("infobox").style.display = "none";
            document.getElementById("main-container").classList.add("modern-container");
        }
    </script>
    <script src="automation-helper.js"></script>
    </body>
</html>
