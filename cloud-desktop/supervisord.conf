[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 1280x800x24
autorestart=true

[program:lxsession]
command=/usr/bin/lxsession -s LXDE -e LXDE
environment=DISPLAY=":1"
autorestart=true

[program:x11vnc]
command=/usr/bin/x11vnc -display :1 -nopw -forever -shared -rfbport 5900
autorestart=true

[program:novnc]
command=/usr/share/novnc/utils/launch.sh --vnc localhost:5900 --listen 6080
autorestart=true

[program:chrome]
command=/usr/bin/google-chrome --no-sandbox --display=:1 --start-maximized --disable-dev-shm-usage http://localhost:3000
autorestart=true
priority=100
